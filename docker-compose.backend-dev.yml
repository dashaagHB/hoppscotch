# Standalone Docker Compose configuration for backend development
# This provides a lightweight setup for running just the Hoppscotch backend
# with hot-reload support, independent of the main docker-compose.yml
#
# USAGE:
#   docker compose -f docker-compose.backend-dev.yml up
#
# PREREQUISITES:
#   1. Copy .env.example to .env and configure DATA_ENCRYPTION_KEY
#   2. Ensure ports 3170 and 5432 are not in use
#
# WARNING:
#   Do not run this alongside the main docker-compose.yml as they both
#   use ports 3170 (backend) and 5432 (database)

x-database-config: &database-config
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-testpass}@backend-db:5432/${POSTGRES_DB:-hoppscotch}?connect_timeout=300

services:
  backend-db:
    image: postgres:15
    container_name: hoppscotch-backend-dev-db
    networks:
      - backend-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass}
      POSTGRES_DB: ${POSTGRES_DB:-hoppscotch}
    volumes:
      - backend-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-migrate:
    container_name: hoppscotch-backend-dev-migrate
    build:
      context: ./packages/hoppscotch-backend
      dockerfile: Dockerfile
      target: dev
    networks:
      - backend-dev
    env_file:
      - .env
    environment:
      <<: *database-config
    depends_on:
      backend-db:
        condition: service_healthy
    command: sh -c "pnpm exec prisma migrate deploy"

  backend:
    container_name: hoppscotch-backend-dev
    build:
      context: ./packages/hoppscotch-backend
      dockerfile: Dockerfile
      target: dev
    networks:
      - backend-dev
    ports:
      - "3170:3170"
    env_file:
      - .env
      - .env.local
    environment:
      <<: *database-config
      PORT: 3170
      PRODUCTION: false
    volumes:
      # Mount source code for hot-reload
      - ./packages/hoppscotch-backend:/usr/src/app
      # Use anonymous volume for node_modules to prevent host/container conflicts
      # This is critical for native dependencies like isolated-vm
      - /usr/src/app/node_modules
    depends_on:
      backend-db:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully

volumes:
  backend-dev-db-data:
    name: hoppscotch-backend-dev-db-data

networks:
  backend-dev:
    name: hoppscotch-backend-dev-network
